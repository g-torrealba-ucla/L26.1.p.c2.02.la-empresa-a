<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empresa A - HTML Plano</title>
</head>

<body>

  <section id="body">
    <h2>Gestión de Empresa (HTML Plano)</h2>
    <button id="body_btNuevoEmpleado">Nuevo Empleado</button>
    <hr>
    <div>
      Empleado con mayor aumento: <span id="body_lblNombreMayorAumento">---</span>
    </div>
    <div>
      Total de nómina nueva: <span id="body_lblTotalNominaNueva">0</span>
    </div>
  </section>

  <section id="empleado" hidden style="margin-top: 20px; border: 1px solid #ccc; padding: 15px; width: 300px;">
    <h5 id="empleado_lblTitulo">Procesar Empleado</h5>
    <div>
      <label>Nombre:
        <input type="text" id="empleado_inNombre" placeholder="Nombre">
      </label>
    </div>
    <div>
      <label>Cédula:
        <input type="number" id="empleado_inCedula" placeholder="Ej: 25123456">
      </label>
    </div>
    <div>
      <label>Sueldo actual:
        <input type="number" id="empleado_inSueldoActual" placeholder="Ej: 500">
      </label>
    </div>
    <div>
      <label>Años trabajando:
        <input type="number" id="empleado_inAniosTrabajando" placeholder="Ej: 6">
      </label>
    </div>
    <br>
    <button id="empleado_btCancelar">Cancelar</button>
    <button id="empleado_btAceptar">Aceptar</button>
  </section>

  <script type="module">
    import cEmpresa from "./dist/controllers/cEmpresa.js";
    import cEmpleado from "./dist/controllers/cEmpleado.js";

    // Importamos SOLO las vistas planas
    import vEmpresaPlain from "./dist/views/vEmpresaPlain.js";
    import vEmpleadoPlain from "./dist/views/vEmpleadoPlain.js";

    // 1. Instanciamos las vistas
    const vistaEmpresa = new vEmpresaPlain();
    const vistaEmpleado = new vEmpleadoPlain();

    // 2. Inyectamos las vistas en los controladores
    const controladorEmpleado = new cEmpleado(vistaEmpleado);
    new cEmpresa(vistaEmpresa, controladorEmpleado);
  </script>
</body>

</html>
