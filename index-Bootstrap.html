<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empresa A - Bootstrap</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

  <div id="app-bootstrap" class="container mt-5">
    <h2>Gestión de Empresa (Bootstrap)</h2>
    <button type="button" class="btn btn-primary" id="body_btNuevoEmpleado">Nuevo Empleado</button>
    <hr>
    <div class="alert alert-info">
      Empleado que recibirá el mayor aumento: <span id="body_lblNombreMayorAumento" class="fw-bold">---</span>
    </div>
    <div class="alert alert-success">
      El total de la nómina nueva: <span id="body_lblTotalNominaNueva" class="fw-bold">0</span>
    </div>
  </div>

  <div class="modal fade" id="empleado" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Procesar Empleado</h5>
        </div>
        <div class="modal-body">
          <label class="form-label">Nombre:</label>
          <input type="text" class="form-control" id="empleado_inNombre">
          <label class="form-label">Cédula:</label>
          <input type="number" class="form-control" id="empleado_inCedula">
          <label class="form-label">Sueldo Actual:</label>
          <input type="number" class="form-control" id="empleado_inSueldoActual">
          <label class="form-label">Años Trabajando:</label>
          <input type="number" class="form-control" id="empleado_inAniosTrabajando">
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="empleado_btCancelar">Cancelar</button>
          <button type="button" class="btn btn-success" id="empleado_btAceptar">Aceptar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script type="module">
    import cEmpresa from "./dist/controllers/cEmpresa.js";
    import cEmpleado from "./dist/controllers/cEmpleado.js";

    // Importamos SOLO las vistas de Bootstrap
    import vEmpresaBootstrap from "./dist/views/vEmpresaBootstrap.js";
    import vEmpleadoBootstrap from "./dist/views/vEmpleadoBootstrap.js";

    // 1. Instanciamos las vistas
    const vistaEmpresa = new vEmpresaBootstrap();
    const vistaEmpleado = new vEmpleadoBootstrap();

    // 2. Inyectamos las vistas en los controladores
    const controladorEmpleado = new cEmpleado(vistaEmpleado);
    new cEmpresa(vistaEmpresa, controladorEmpleado);
  </script>
</body>

</html>
